[project]
name = "chatterbox-vllm-audiobook"
description = "EPUB-to-M4B audiobook generation with Chatterbox TTS, vLLM, and a Gradio web interface"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
readme = "README.md"
authors = [
    {name = "David Li", email = "david@david-li.com"},
    {name = "resemble-ai", email = "engineering@resemble.ai"}
]
maintainers = [{name = "anethema"}]
keywords = ["tts", "chatterbox", "vllm", "audiobook", "epub", "m4b", "gradio"]
dependencies = [
    "torch",
    "torchaudio",
    "transformers",
    "tokenizers",
    "scipy",
    "numpy",
    "librosa",
    "s3tokenizer",
    "omegaconf",
    "conformer",
    "diffusers",
    "peft",
    "llvmlite>=0.44.0",
    "vllm==0.10.0",
    "gradio",
    "spacy-pkuseg",
    "pykakasi",
    "silero-vad",
    "pyrnnoise>=0.4.3,<0.5",
    # pyrnnoise 0.4.3 still uses the pre-0.5 audiolab API, whose PyAV adapter
    # in turn imports av.option (removed in PyAV 16).
    "audiolab==0.4.9",
    "av==15.1.0",
]

[project.optional-dependencies]
dev = ["build", "twine"]

[tool.setuptools.dynamic]
version = { file = ".latest-version.generated.txt" }

[tool.setuptools.package-data]
chatterbox_vllm = ["models/t3/*.json", "models/*/t3/*.json"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
"Homepage" = "https://github.com/anethema/chatterbox-vllm-audiobook"
"Source" = "https://github.com/anethema/chatterbox-vllm-audiobook"
"Tracker" = "https://github.com/anethema/chatterbox-vllm-audiobook/issues"
"Upstream" = "https://github.com/randombk/chatterbox-vllm"
